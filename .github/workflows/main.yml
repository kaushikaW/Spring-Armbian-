name: cIPipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t user-service:latest .

      - name: Start containers
        run: |
          docker-compose down
          docker-compose up -d
          sleep 20

      - name: Test API
        run: curl -f http://localhost:8081/api/test/all

      - name: Show logs
        run: docker-compose logs
